<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRC 9427 Simulator</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body class="lobby">
<canvas id="view"></canvas>
<!-- LOBBY state: menus only. Detached from the page while a simulation runs (main.js setAppState). -->
<div id="lobbyRoot">
<div id="shade"></div>

<header id="topbar">
  <div class="brand"><span class="brand-mark">9427</span><span class="brand-name">SIMULATOR</span><span class="season">REBUILT 2026</span></div>
  <div class="icons">
    <span class="pill" id="fps">-- FPS</span>
    <button class="ico" data-open="settings" title="設定">⚙</button>
  </div>
</header>

<!-- Lobby -->
<section id="lobby">
  <div id="cards"></div>
  <nav id="dock"></nav>
  <div id="startbar">
    <button id="importbtn" class="modebtn importbtn" title="選擇機器人程式資料夾"><span class="mi">📂</span><span id="importlabel">導入程式碼</span></button>
    <button id="modebtn" class="modebtn"><span class="mi">◈</span><span id="modelabel">正式比賽</span></button>
    <button id="start" class="cta"><span class="cta-sub" id="startsub">READY</span><span class="cta-main">START</span></button>
  </div>
</section>

<!-- Mode select -->
<section id="modes" hidden>
  <div class="screen-head"><button class="back" data-back>‹</button><h2>模式選擇</h2></div>
  <div class="modes-body">
    <div class="rail" id="rail"></div>
    <div class="modelist" id="modelist"></div>
    <div class="preview"><div class="preview-tag" id="prevtag"></div></div>
  </div>
</section>

<!-- Modal (robot / field / controls / settings) -->
<div id="modal" hidden>
  <div class="dialog">
    <div class="dialog-head"><h2 id="mtitle"></h2><button class="x" data-close>✕</button></div>
    <div class="dialog-body">
      <div class="dlist" id="mlist"></div>
      <div class="dcontent" id="mcontent"></div>
    </div>
  </div>
</div>

</div>

<!-- IN-GAME state: only the match HUD. Attached only while a simulation runs. -->
<div id="gameRoot">
<div id="hud">
  <button id="hudExit" class="hud-exit" title="Esc">‹ <span id="hudExitLabel">離開</span></button>
  <div class="hud-score"><span class="hs-b" id="hudBlue">0</span><span class="hs-t"><b id="hudTime">--:--</b><small id="hudPhase"></small></span><span class="hs-r" id="hudRed">0</span></div>
  <div class="hud-right">
    <span class="pill" id="hudFps">-- FPS</span>
    <div id="camModes" class="cam-modes" title="V"><button data-cam="free" id="camFree">自由</button><button data-cam="driver" id="camDriver">駕駛員</button><button data-cam="follow" id="camFollow">跟車</button></div>
  </div>
</div>
<div id="dsbar" hidden>
  <span class="ds-chip" id="dsstate">ROBOT: --</span>
  <button class="ds-btn" id="dsen">ENABLE</button>
  <button class="ds-btn" id="dsmode">TELEOP</button>
</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
