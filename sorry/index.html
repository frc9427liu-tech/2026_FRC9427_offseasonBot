<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>對不起</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a12;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#fff}
#start{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0b0a12;cursor:pointer;transition:opacity 1s}
#start span{font-size:clamp(16px,3vw,24px);letter-spacing:.3em;color:#ffc4dd;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
#title{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:clamp(22px,4.6vw,44px);letter-spacing:.3em;text-indent:.3em;opacity:0;transition:opacity 1.6s;z-index:20;text-shadow:0 0 24px #ff9fc4}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-40px;color:#ff9fc4;opacity:.0;animation:up linear forwards}
@keyframes up{10%{opacity:.5}100%{transform:translateY(-110vh) rotate(30deg);opacity:0}}
#stage{position:fixed;inset:0;z-index:10;pointer-events:none}
.pop{position:absolute;border-radius:8px;box-shadow:0 4px 14px #0008;color:#3b2a3a;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;overflow:hidden}
.pop.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.pop .bar{height:16px;background:#ffffffaa;font-size:10px;padding:0 7px;display:flex;justify-content:space-between;align-items:center}
.pop .msg{font-weight:600;text-align:center;white-space:nowrap}
.pop.out{transition:transform 1.1s cubic-bezier(.15,.8,.25,1)}
.pop.closable{pointer-events:auto;cursor:pointer}
.pop.gone{transition:transform .3s,opacity .3s;opacity:0!important;transform:translate(-50%,-50%) scale(.3)!important}
#hint{position:fixed;left:0;right:0;bottom:5%;text-align:center;z-index:30;color:#ffc4dd;font-size:14px;letter-spacing:.2em;opacity:0;transition:opacity 1s;pointer-events:none}
#letter{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:8vw 8vw 24vh;opacity:0;pointer-events:none;transition:opacity 1.5s;background:#0b0a12aa}
#letter.show{opacity:1;pointer-events:auto}
#text{max-width:560px;font-size:clamp(17px,2.6vw,24px);line-height:2.1;letter-spacing:.08em;text-align:center;min-height:9em;white-space:pre-wrap;text-shadow:0 0 14px #ff9fc499}
#btns{margin-top:36px;display:flex;gap:18px;opacity:0;transition:opacity 1s;position:relative;height:52px}
#btns.show{opacity:1}
button{font:inherit;font-size:17px;letter-spacing:.15em;padding:12px 26px;border-radius:30px;border:0;cursor:pointer}
#yes{background:#ff9fc4;color:#3b1830;box-shadow:0 0 22px #ff9fc4aa}
#no{background:#ffffff22;color:#fff;position:relative}
#after{margin-top:26px;font-size:clamp(18px,3vw,26px);letter-spacing:.2em;opacity:0;transition:opacity 1.4s;text-align:center;line-height:1.9}
#sign{position:fixed;right:5vw;bottom:4vh;z-index:45;font-size:13px;color:#ffc4dd99;letter-spacing:.2em;opacity:0;transition:opacity 2s}
canvas{position:fixed;inset:0;z-index:50;pointer-events:none}
#pf{z-index:2}
#mel{position:fixed;left:50%;bottom:2vh;width:min(46vw,230px);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 26px #ff9fc4);transform:translateX(-50%);z-index:42;opacity:0;transition:opacity 1.6s;pointer-events:none;animation:bob 3s ease-in-out infinite}
#mel.show{opacity:1}
@keyframes bob{50%{margin-bottom:10px;filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 40px #ff7fae)}}
</style>
</head>

<canvas id="pf"></canvas>
<canvas id="fx"></canvas>
<script>
/* ===== 想改內容,只要改這一區 ===== */
const msgs=['記得吃飯','要多喝水','別熬夜','對不起','順順利利','保持好心情','好好愛自己','天冷多穿衣服','辛苦了','抱抱妳','一切都會好起來','早點休息','妳已經很棒了','慢慢來不急','累了就休息','今天也要開心'];
const letter=[
 '（第一段）\n這裡放你想說的第一段話。',
 '（第二段）\n這裡放你想說的第二段話。',
 '（第三段）\n這裡放你想說的第三段話。'
];
const afterText='謝謝妳願意聽我說\n（這裡是按下「原諒我嗎？」後的那句話）';
/* ================================= */

const cols=['#ffb6d0','#ffd1e3','#ffc4dd','#e7c6ff','#c7e0ff','#fff0a8','#ffd6c2','#ff9fc4','#b8f0c8'];
const $=id=>document.getElementById(id);
const stage=$('stage'),title=$('title');
const W=()=>innerWidth,H=()=>innerHeight;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* 背景緩慢飄的愛心 */
function floaty(){
  const e=document.createElement('div');e.className='fl';e.textContent='♥';
  e.style.left=Math.random()*100+'vw';e.style.fontSize=(10+Math.random()*22)+'px';
  e.style.animationDuration=(9+Math.random()*8)+'s';
  $('bg').appendChild(e);setTimeout(()=>e.remove(),18000);
}

async function run(){
  // 1 標題
  await wait(400);title.style.opacity=1;await wait(1800);
  // 2 彈窗圍成愛心
  const N=56,unit=Math.min(W(),H());
  const cw=Math.max(64,unit*.13),ch=cw*.42;
  const cx=W()/2,cy=H()/2+unit*.02,sc=unit/34;
  const cards=[];let z=0;
  for(let k=0;k<N;k++){
    const t=Math.PI+k/N*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    const layers=2+Math.floor(Math.random()*2);
    for(let l=0;l<layers;l++){
      const px=cx+x*sc+(Math.random()-.5)*cw*.35,py=cy+y*sc+(Math.random()-.5)*ch*.5;
      const d=document.createElement('div');d.className='pop';
      d.style.cssText+=`left:${px}px;top:${py}px;width:${cw}px;background:${cols[(k+l*3)%cols.length]}`;
      d.innerHTML=`<div class="bar"><span>♡</span><span>×</span></div><div class="msg" style="font-size:${ch*.34}px;padding:${ch*.22}px 6px">${msgs[(k+l*5)%msgs.length]}</div>`;
      d.style.zIndex=z++;
      stage.appendChild(d);cards.push({d,px,py});
      setTimeout(()=>d.classList.add('in'),l*25);
    }
    await wait(80);
  }
  // 3 停 2 秒 → 散開
  await wait(2000);
  title.style.opacity=0;
  for(const c of cards){
    const tx=cw/2+Math.random()*(W()-cw),ty=ch/2+Math.random()*(H()-ch*1.6);
    c.d.classList.add('out');
    c.d.style.transform=`translate(calc(-50% + ${tx-c.px}px),calc(-50% + ${ty-c.py}px)) rotate(${(Math.random()-.5)*16}deg) scale(1)`;
  }
  await wait(1300);
  // 4 讓她一個個關掉(全部關完或 25 秒後自動進下一步)
  $('hint').style.opacity=1;
  await new Promise(res=>{
    let left=cards.length;
    const fin=()=>{res()};
    setTimeout(fin,25000);
    for(const c of cards){
      c.d.classList.add('closable');c.d.classList.remove('out');
      c.d.style.transition='transform .3s,opacity .3s';
      c.d.addEventListener('click',()=>{
        if(c.d.classList.contains('gone'))return;
        c.d.classList.add('gone');
        if(--left<=0)setTimeout(fin,500);
      });
    }
  });
  $('hint').style.opacity=0;
  for(const c of cards)c.d.classList.add('gone');
  await wait(600);
  // 5 信(打字機)
  $('letter').classList.add('show');$('mel').classList.add('show');
  await wait(1500);
  const tx=$('text');
  for(const para of letter){
    tx.textContent='';
    for(const ch of para){tx.textContent+=ch;await wait(ch==='\n'?500:110);}
    await wait(2200);
  }
  tx.textContent='';
  // 6 按鈕
  tx.textContent='原諒我嗎？';
  $('btns').classList.add('show');
  setupButtons();
}

function setupButtons(){
  const no=$('no');
  const dodge=e=>{
    e.preventDefault();
    no.style.transform=`translate(${(Math.random()-.5)*Math.min(W()*.6,320)}px,${(Math.random()-.5)*160}px)`;
  };
  no.addEventListener('mouseenter',dodge);
  no.addEventListener('touchstart',dodge);
  no.addEventListener('click',dodge);
  $('yes').addEventListener('click',async()=>{
    $('btns').classList.remove('show');$('btns').style.pointerEvents='none';
    $('text').textContent='';
    boom(W()/2,H()/2);setTimeout(()=>boom(W()*.25,H()*.35),400);setTimeout(()=>boom(W()*.75,H()*.4),800);
    const iv=setInterval(()=>boom(Math.random()*W(),Math.random()*H()*.7),700);
    $('after').textContent=afterText;$('after').style.opacity=1;
    $('sign').style.opacity=1;   // 7 收尾
    
    setTimeout(()=>clearInterval(iv),9000);
  });
}

/* 愛心煙火 */
const cv=$('fx'),g=cv.getContext('2d');let parts=[];
function size(){cv.width=W();cv.height=H()}size();addEventListener('resize',size);
function boom(x,y){
  const c=cols[Math.floor(Math.random()*cols.length)];
  for(let i=0;i<46;i++){
    const t=i/46*Math.PI*2;
    const vx=16*Math.pow(Math.sin(t),3),vy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    parts.push({x,y,vx:vx*.22,vy:vy*.22,life:1,c});
  }
}
(function loop(){
  g.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.life-=.012;
    g.globalAlpha=Math.max(p.life,0);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill();
  }
  requestAnimationFrame(loop);
})();

/* 懸浮粒子:粉色愛心/星星/蝴蝶結,緩慢飄,手指或滑鼠靠近會被推開 */
const pf=$("pf"),pg=pf.getContext("2d");let pts=[],ptr={x:-999,y:-999};
function psize(){pf.width=W();pf.height=H()}psize();addEventListener("resize",psize);
addEventListener("pointermove",e=>{ptr.x=e.clientX;ptr.y=e.clientY});
addEventListener("pointerdown",e=>{ptr.x=e.clientX;ptr.y=e.clientY});
addEventListener("pointerup",()=>{ptr.x=ptr.y=-999});
const shapes=["♥","★","✦","🎀"];
function startParticles(){
  const n=Math.round(Math.min(70,W()*H()/16000));
  for(let i=0;i<n;i++)pts.push({x:Math.random()*W(),y:Math.random()*H(),vx:(Math.random()-.5)*.3,vy:-.15-Math.random()*.4,s:12+Math.random()*20,c:cols[i%cols.length],ch:shapes[i%shapes.length],ph:Math.random()*6.28,a:.25+Math.random()*.5});
  (function tick(t){
    pg.clearRect(0,0,pf.width,pf.height);
    for(const p of pts){
      const dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy);
      if(d<110&&d>0){p.vx+=dx/d*.6;p.vy+=dy/d*.6}
      p.vx*=.96;p.vy=p.vy*.96+(-.25*.04);
      p.x+=p.vx+Math.sin(t/1500+p.ph)*.25;p.y+=p.vy;
      if(p.y<-30){p.y=H()+30;p.x=Math.random()*W()}
      if(p.x<-30)p.x=W()+30;if(p.x>W()+30)p.x=-30;
      const tw=.55+.45*Math.sin(t/500+p.ph),r=p.s/4,gr=pg.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);gr.addColorStop(0,"#fff");gr.addColorStop(.3,p.c);gr.addColorStop(1,"rgba(255,159,196,0)");pg.globalAlpha=p.a*tw+.15;pg.fillStyle=gr;pg.beginPath();pg.arc(p.x,p.y,r*3,0,6.283);pg.fill();
    }
    requestAnimationFrame(tick);
  })(0);
}
$('start').addEventListener('click',()=>{
  $('start').style.opacity=0;setTimeout(()=>$('start').remove(),1000);
  startParticles();
  run();
},{once:true});
</script>
</body>
</html>
