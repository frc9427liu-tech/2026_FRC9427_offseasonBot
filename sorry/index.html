<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>對不起</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a12;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#title{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-size:clamp(22px,4.6vw,44px);letter-spacing:.3em;text-indent:.3em;opacity:0;transition:opacity 1.6s;z-index:20;text-shadow:0 0 24px #ff9fc4}
#stage{position:fixed;inset:0;z-index:10;pointer-events:none}
.pop{position:absolute;border-radius:8px;box-shadow:0 4px 14px #0008;color:#3b2a3a;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;overflow:hidden}
.pop.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.pop .bar{height:16px;background:#ffffffaa;font-size:10px;padding:0 7px;display:flex;justify-content:space-between;align-items:center}
.pop .msg{font-weight:600;text-align:center;white-space:nowrap}
.pop.out{transition:transform 1.1s cubic-bezier(.15,.8,.25,1)}
</style>
</head>
<body>
<div id="title">對不起,老大</div>
<div id="stage"></div>
<script>
const msgs=['記得吃飯','要多喝水','別熬夜','對不起','我想妳了','妳最重要','我會改','別生氣了嘛','抱抱妳','我在這裡','想好好珍惜妳','天冷多穿衣服','喜歡妳'];
const cols=['#ffb6d0','#ffd1e3','#ffc4dd','#e7c6ff','#c7e0ff','#fff0a8','#ffd6c2','#ff9fc4','#b8f0c8'];
const stage=document.getElementById('stage'),title=document.getElementById('title');
const W=()=>innerWidth,H=()=>innerHeight;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function run(){
  // step 1: 對不起老大
  await wait(400);title.style.opacity=1;
  await wait(1800);
  // step 2: popups, one every 0.2s, surround into a heart
  const N=56,unit=Math.min(W(),H());
  const cw=Math.max(64,unit*.115),ch=cw*.42;
  const cx=W()/2,cy=H()/2+unit*.03,sc=unit/40;
  const cards=[];
  let z=0;
  for(let k=0;k<N;k++){
    const t=Math.PI+k/N*Math.PI*2;                 // start at the bottom tip, go around
    const x=16*Math.pow(Math.sin(t),3);
    const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    const layers=2+Math.floor(Math.random()*2);    // 2~3 overlapping popups per spot
    for(let l=0;l<layers;l++){
      const px=cx+x*sc+(Math.random()-.5)*cw*.35,py=cy+y*sc+(Math.random()-.5)*ch*.5;
      const d=document.createElement('div');d.className='pop';
      d.style.cssText+=`left:${px}px;top:${py}px;width:${cw}px;background:${cols[(k+l*3)%cols.length]}`;
      d.innerHTML=`<div class="bar"><span>♡</span><span>×</span></div><div class="msg" style="font-size:${ch*.42}px;padding:${ch*.22}px 6px">${msgs[(k+l*5)%msgs.length]}</div>`;
      d.style.zIndex=z++;
      stage.appendChild(d);cards.push({d,px,py});
      setTimeout(()=>d.classList.add('in'),l*25);
    }
    await wait(80);
  }
  // step 3: hold 2s, then burst outward and settle scattered across the screen
  await wait(2000);
  for(const c of cards){
    const tx=cw/2+Math.random()*(W()-cw),ty=ch/2+Math.random()*(H()-ch*1.6);
    c.d.classList.add('out');
    c.d.style.transform=`translate(calc(-50% + ${tx-c.px}px),calc(-50% + ${ty-c.py}px)) rotate(${(Math.random()-.5)*16}deg) scale(1)`;
  }
}run();
</script>
</body>
</html>
