<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>對不起</title>
<style>
:root{--c:#ff8fa3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 25%,#fff),#fff 70%);color:#3a2a2e}
.card{max-width:560px;width:100%;background:#fff;border-radius:24px;padding:40px 32px;box-shadow:0 20px 60px rgba(0,0,0,.1);animation:in .9s ease}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
h1{margin:0 0 4px;font-size:2.6rem;color:var(--c)}.to{color:#8a7a7e;margin-bottom:20px}
.body{white-space:pre-line;line-height:1.9;font-size:1.1rem}
ul{padding:0;list-style:none;margin:24px 0}li{padding:10px 14px;margin:8px 0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:8px}
.from{text-align:right;color:#8a7a7e;margin-top:24px}
button{display:block;margin:28px auto 0;padding:12px 28px;border:0;border-radius:99px;background:var(--c);color:#fff;font-size:1rem;cursor:pointer}
.h{position:fixed;pointer-events:none;animation:up 3s ease-out forwards}@keyframes up{to{transform:translateY(-100vh);opacity:0}}
</style></head><body><div class="card"><h1 id="t"></h1><div class="to" id="to"></div><div class="body" id="b"></div><ul id="p"></ul><div class="from" id="f"></div><button id="btn">原諒我好嗎?💗</button></div>
<script>
fetch('/api/content').then(r=>r.json()).then(c=>{
 document.documentElement.style.setProperty('--c',c.theme||'#ff8fa3');
 document.title=c.title;t.textContent=c.title;to.textContent=c.to;b.textContent=c.body;f.textContent='— '+c.from;
 (c.promises||[]).forEach(x=>{const l=document.createElement('li');l.textContent=x;p.appendChild(l)});
});
btn.onclick=()=>{btn.textContent='謝謝你 💗';for(let i=0;i<24;i++){const h=document.createElement('div');h.className='h';h.textContent='💗';h.style.left=Math.random()*100+'vw';h.style.top='100vh';h.style.fontSize=16+Math.random()*24+'px';h.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),5000)}};
</script></body></html>
